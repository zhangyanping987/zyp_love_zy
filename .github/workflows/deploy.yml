name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # 大图/视频/BGM → OSS；thumbs/posters 留在 Pages 加速首屏
      # 华东桶就绪后改为 zyp-love-zy-hz.oss-cn-hangzhou.aliyuncs.com
      - run: npm run build
        env:
          VITE_ASSET_BASE: https://zyp-love-zy.oss-cn-hongkong.aliyuncs.com/
      - run: |
          rm -rf dist/media/images dist/media/videos dist/media/audio
          # 保留 media/thumbs、media/posters

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
